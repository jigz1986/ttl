display:inline-flex;

	#time{
        position: fixed;
		right: 30px;
		bottom: 0px;

        }

		{color:black;}
     

        @media (max-width: 1000px)  {
        div {
            color: black;

<body>
<div id="404"><image src="https://blog.openreplay.com/images/a-guide-to-404-error-pages/images/image1.png"></img>
    <div id="time"> <span id="th"></span> : <span id="tm"> </span> : <span id="ts"></span> </div>
    <script>
        function fetchData() {
        const date = new Date();
        var h = 17 - date.getHours();
        var m = 59 - date.getMinutes();
        var s = 59 - date.getSeconds();
        document.getElementById("th").innerHTML = h; 
		document.getElementById("tm").innerHTML = m;
		document.getElementById("ts").innerHTML = s;}
        fetchData(); 
const intervalId = setInterval(fetchData,1000);
    </script>

</body>
