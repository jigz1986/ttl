<head>

    <title>TTL</title>
    <style>
        html 
        {
		color:#ddd;
        font-family: "Orbitron", sans-serif;
display:inline-flex;
justify-content:center;
align-items:center;
height:99%;		}
		
	#time{
        position: fixed;
		right: 0px;
		bottom: 0px;

        } 
        
		#404{
		display:inline-flex;}
     

        @media (max-width: 1000px)  {
        div {
            color: black;
        font-size: 10vw;}
        }
    </style>

</head>

<body>
<div id="404"><image src="https://blog.openreplay.com/images/a-guide-to-404-error-pages/images/image1.png"></img>
    <div id="time"></div>
    <script>
        function fetchData() {
        const date = new Date();
        var h = 17 - date.getHours();
        var m = 60 - date.getMinutes();
        var s = 60 - date.getSeconds();
        document.getElementById("time").innerHTML = h +" : "+m+" : "+s; }

        fetchData(); 
const intervalId = setInterval(fetchData,1000);
    </script>

</body>
